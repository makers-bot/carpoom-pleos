<title>카품 시연 무대</title>
<style>
  /* 시연 무대: 동승자 휴대폰 2대 + 차량 Pleos 화면을 한 화면(1920×1080)에 띄우고 상태를 실시간으로 잇는다(영상 녹화용).
   각 화면은 iframe이며, 변경은 이 페이지가 다른 화면으로 전달한다(체험용. 실제 서비스에서는 서버가 담당).
   기기 틀 안의 화면(.scr)은 iframe을 축소한 크기와 정확히 같아서, 화면이 틀 가운데에 딱 맞는다. */
  :root {
    --bg: #0e0f12;
    --fg: #f2f4f7;
    --muted: #8e959f;
    --accent: #2f8cff;
    color-scheme: dark;
    --ps: 0.82; /* 휴대폰 축소 비율: 390×844 → 319.8×692.1 */
    --cs: 0.675; /* 차량 화면 축소 비율: 1600×900 → 1080×607.5 */
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #23262c 0%, #16171a 55%, var(--bg) 100%);
    color: var(--fg);
    font-family: 'Asta Sans', 'Malgun Gothic', system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
  }
  header {
    position: absolute;
    left: 40px;
    top: 40px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  header b {
    font-size: 30px;
    letter-spacing: -0.02em;
  }
  header span {
    font-size: 18px;
    color: var(--muted);
  }
  header .live {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    color: var(--muted);
  }
  header .live i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: b 1.4s ease-in-out infinite;
  }
  @keyframes b {
    50% {
      opacity: 0.3;
    }
  }
  .dev {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .dev .cap {
    font-size: 18px;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }
  .dev .cap b {
    color: var(--fg);
  }
  /* 기기 틀: 테두리(padding) + 화면(.scr). 화면 크기 = iframe 크기 × 축소 비율 */
  .phone {
    padding: 10px;
    border-radius: 50px;
    background: linear-gradient(160deg, #2c2f35, #0b0c0e 40%);
    box-shadow:
      0 0 0 1.5px #3a3e46,
      0 30px 60px rgba(0, 0, 0, 0.6);
  }
  .phone .scr {
    position: relative;
    width: calc(390px * var(--ps));
    height: calc(844px * var(--ps));
    border-radius: 40px;
    overflow: hidden;
    background: #000;
  }
  .carframe {
    padding: 10px;
    border-radius: 26px;
    background: linear-gradient(160deg, #2c2f35, #0b0c0e 40%);
    box-shadow:
      0 0 0 1.5px #3a3e46,
      0 30px 60px rgba(0, 0, 0, 0.6);
  }
  .carframe .scr {
    position: relative;
    width: calc(1600px * var(--cs));
    height: calc(900px * var(--cs));
    border-radius: 16px;
    overflow: hidden;
    background: #000;
  }
  .scr iframe {
    position: absolute;
    left: 0;
    top: 0;
    border: 0;
    transform-origin: 0 0;
    display: block;
  }
  .phone iframe {
    width: 390px;
    height: 812px;
    top: calc(32px * var(--ps));
    transform: scale(var(--ps));
  }
  /* 휴대폰 상태줄: 시계는 차량 화면과 같은 시각을 보여 준다 */
  .pstat {
    position: absolute;
    left: 0;
    top: 0;
    width: 390px;
    height: 32px;
    transform: scale(var(--ps));
    transform-origin: 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 26px 0 30px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    z-index: 3;
  }
  .pstat.light {
    background: #ffffff;
    color: #101418;
  }
  .pstat.dark {
    background: #0b0d10;
    color: #f2f4f7;
  }
  .pstat .ic {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pstat svg {
    height: 13px;
    width: auto;
    fill: currentColor;
  }
  .carframe iframe {
    width: 1600px;
    height: 900px;
    transform: scale(var(--cs));
  }
  /* Pleos 틀 모드(?frame=폴더/): 에뮬레이터에서 캡처한 Pleos Connect 화면(2560×1440) 위, 앱 창 자리에 차량 앱을 띄운다.
     주행 중에는 왼쪽 주행 정보 화면을 주행 영상으로 바꾸고, 설정 적용 뒤에는 조수석 열선이 켜진 화면으로 바꾼다 */
  .pf {
    position: absolute;
    inset: 0;
    display: none;
  }
  .stage.framed .pf {
    display: block;
  }
  .pf img,
  .pf video {
    position: absolute;
    display: block;
    transition: opacity 0.45s;
  }
  .pf .full {
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .pf .left {
    left: 0;
    top: calc(100% * 10 / 1440);
    width: calc(100% * 852 / 2560);
    height: calc(100% * 1290 / 1440);
    object-fit: fill;
  }
  .pf .off {
    opacity: 0;
  }
  /* 캡처한 화면의 시계 자리를 덮고, 휴대폰과 같은 시각을 보여 준다 */
  .pf .pfclock {
    position: absolute;
    left: calc(100% * 2398 / 2560);
    top: calc(100% * 24 / 1440);
    width: calc(100% * 160 / 2560);
    height: calc(100% * 44 / 1440);
    padding-left: calc(100% * 9 / 2560);
    box-sizing: border-box;
    display: flex;
    align-items: center;
    background: #000;
    color: #d4d4d4;
    font-size: calc(1600px * var(--cs) * 29 / 2560);
    font-weight: 400;
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  .stage.framed .carframe .scr {
    border-radius: 10px;
  }
  .stage.framed .carframe iframe {
    width: 1682px;
    height: 1210px;
    left: calc(1600px * var(--cs) * 853 / 2560);
    top: calc(900px * var(--cs) * 90 / 1440);
    transform: scale(calc(1600 * var(--cs) / 2560));
    z-index: 2;
  }
  .links {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 15px;
    color: var(--muted);
  }
  .links a {
    color: var(--muted);
  }
</style>
<div class="stage" id="stage">
  <header>
    <b>카품 Car Poom</b><span>동승자 휴대폰 ↔ 차량 Pleos 화면 실시간 연동 시연</span
    ><span class="live"><i></i>같은 상태를 실시간으로 공유합니다</span>
  </header>
  <div class="dev" style="left: 40px; top: 150px">
    <div class="phone">
      <div class="scr">
        <div class="pstat light">
          <span class="pclock"></span
          ><span class="ic"
            ><svg viewBox="0 0 18 12">
              <rect x="0" y="8" width="3" height="4" rx="1" />
              <rect x="5" y="5" width="3" height="7" rx="1" />
              <rect x="10" y="2.5" width="3" height="9.5" rx="1" />
              <rect x="15" y="0" width="3" height="12" rx="1" /></svg
            ><svg viewBox="0 0 26 12">
              <rect
                x="0.6"
                y="0.6"
                width="21.8"
                height="10.8"
                rx="3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <rect x="2.3" y="2.3" width="15" height="7.4" rx="1.6" />
              <rect x="23.6" y="3.8" width="2" height="4.4" rx="1" /></svg
          ></span>
        </div>
        <iframe
          id="f-dad"
          title="아버지 휴대폰"
          src="carpoom.html?user=u_youngsoo&amp;nosplash=1&amp;theme=light"
        ></iframe>
      </div>
    </div>
    <div class="cap"><b>영수 (아버지)</b> 데이케어센터, 밝은 화면</div>
  </div>
  <div class="dev" style="left: 402px; top: 150px">
    <div class="phone">
      <div class="scr">
        <div class="pstat dark">
          <span class="pclock"></span
          ><span class="ic"
            ><svg viewBox="0 0 18 12">
              <rect x="0" y="8" width="3" height="4" rx="1" />
              <rect x="5" y="5" width="3" height="7" rx="1" />
              <rect x="10" y="2.5" width="3" height="9.5" rx="1" />
              <rect x="15" y="0" width="3" height="12" rx="1" /></svg
            ><svg viewBox="0 0 26 12">
              <rect
                x="0.6"
                y="0.6"
                width="21.8"
                height="10.8"
                rx="3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
              />
              <rect x="2.3" y="2.3" width="15" height="7.4" rx="1.6" />
              <rect x="23.6" y="3.8" width="2" height="4.4" rx="1" /></svg
          ></span>
        </div>
        <iframe id="f-kid" title="딸 휴대폰" src="carpoom.html?user=u_haneul&amp;nosplash=1&amp;theme=dark"></iframe>
      </div>
    </div>
    <div class="cap"><b>하늘 (딸)</b> 학교, 어두운 화면</div>
  </div>
  <div class="dev" style="left: 780px; top: 192px">
    <div class="carframe">
      <div class="scr">
        <div class="pf" id="pf">
          <img class="full" id="pf-park" alt="" />
          <img class="full off" id="pf-heat" alt="" />
          <img class="full off" id="pf-toast" alt="" />
          <video class="left off" id="pf-drive" muted loop playsinline preload="auto"></video>
          <div class="pfclock" id="pf-clock"></div>
        </div>
        <iframe
          id="f-car"
          title="차량 Pleos 화면"
          src="pleos.html?vehicle=v_ioniq5&amp;theme=dark&amp;embed=1"
        ></iframe>
      </div>
    </div>
    <div class="cap"><b>지민 (운전자, 워킹맘)</b> 아이오닉 5 Pleos Connect</div>
  </div>
  <div class="links">
    각 화면은 따로 열 수도 있습니다: <a href="carpoom.html" target="_blank">모바일 앱</a>,
    <a href="pleos.html" target="_blank">Pleos 앱</a>
  </div>
</div>
<script>
  (function () {
    'use strict';
    const stage = document.getElementById('stage');
    const frames = () => [...document.querySelectorAll('iframe')];
    function fit() {
      // innerWidth는 휴대폰에서 화면보다 넓은 내용이 있으면 커지므로, 실제로 보이는 크기(clientWidth)를 쓴다
      const vw = document.documentElement.clientWidth || innerWidth;
      const vh = document.documentElement.clientHeight || innerHeight;
      const s = Math.min(vw / 1920, vh / 1080);
      stage.style.transform = `translate(${(vw - 1920 * s) / 2}px,${(vh - 1080 * s) / 2}px) scale(${s})`;
    }
    addEventListener('resize', fit);
    fit();
    function tick() {
      const d = new Date();
      const t = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
      document.querySelectorAll('.pclock').forEach((e) => (e.textContent = t));
      const car = document.getElementById('pf-clock');
      if (car) car.textContent = t.padStart(5, '0') + (d.getHours() < 12 ? ' 오전' : ' 오후');
    }
    tick();
    setInterval(tick, 5000);
    // Pleos 틀 모드
    const FRAME = new URLSearchParams(location.search).get('frame');
    const pf = {};
    if (FRAME) {
      stage.classList.add('framed');
      const car = document.getElementById('f-car');
      car.src = car.getAttribute('src').replace('embed=1', 'app=1');
      ['park', 'heat', 'toast', 'drive'].forEach((k) => (pf[k] = document.getElementById('pf-' + k)));
      pf.park.src = FRAME + 'park.png';
      pf.heat.src = FRAME + 'park_heat.png';
      pf.toast.src = FRAME + 'park_heat_toast.png';
      pf.drive.src = FRAME + 'drive.mp4';
    }
    let pfDriving = false,
      pfHeat = false,
      pfDriveOff = 0;
    function pfSetDriving(on) {
      if (!FRAME || on === pfDriving) return;
      pfDriving = on;
      clearTimeout(pfDriveOff);
      if (on) {
        const p = pf.drive.play();
        if (p && p.catch) p.catch(() => {});
        pf.drive.classList.remove('off');
      } else {
        pf.drive.classList.add('off');
        pfDriveOff = setTimeout(() => pf.drive.pause(), 500);
      }
    }
    function pfSetHeat(on) {
      if (!FRAME || on === pfHeat) return;
      pfHeat = on;
      // 열선이 켜지는 순간 Pleos가 띄우는 '동승석 열선 시트' 알림을 잠깐 보여 준 뒤, 열선 아이콘이 켜진 화면으로 둔다
      pf.toast.classList.toggle('off', !on);
      pf.heat.classList.toggle('off', !on);
      if (on) setTimeout(() => pf.toast.classList.add('off'), 2600);
    }
    // 한 화면에서 바뀐 상태를 나머지 화면으로 전달한다(가장 최신 rev만)
    let latest = null;
    addEventListener('message', (e) => {
      const d = e.data;
      if (!d) return;
      if (d.__carpoomLive) {
        if (d.data && d.data.type === 'car') pfSetDriving(!!d.data.driving);
        frames().forEach((f) => {
          if (f.contentWindow !== e.source) {
            try {
              f.contentWindow.postMessage(d, '*');
            } catch (_) {}
          }
        });
        return;
      }
      if (d.__carpoom && d.state) {
        pfSetHeat(
          Object.values(d.state.bookings || {}).some((b) => b.userId === 'u_youngsoo' && b.status === 'COMPLETED'),
        );
        if (!latest || (d.state.rev || 0) > (latest.state.rev || 0)) latest = d;
        frames().forEach((f) => {
          if (f.contentWindow !== e.source) {
            try {
              f.contentWindow.postMessage(d, '*');
            } catch (_) {}
          }
        });
      } else if (d.__carpoomHello) {
        if (latest) {
          try {
            e.source.postMessage(latest, '*');
          } catch (_) {}
        }
        frames().forEach((f) => {
          if (f.contentWindow !== e.source) {
            try {
              f.contentWindow.postMessage(d, '*');
            } catch (_) {}
          }
        });
      }
    });
    window.__stage = {
      frames,
      get latest() {
        return latest;
      },
    };
  })();
</script>
