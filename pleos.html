        return card(`<div class="eyebrow"><span class="dot live"></span>${dv.idx + 1}번째 픽업으로 가는 중${relation(b.userId) ? ', ' + h(relation(b.userId)) : ''}</div>
      <div class="row"><span class="av">${avatar(b.userId)}<span class="badge">${dv.idx + 1}</span></span><div class="grow"><div class="h1">${h(user(b.userId).name)}님께 가고 있어요</div></div></div>
      <div class="sub" id="lv-sub">${h(b.pickupPoint.label)}, ${h(core.pickupTimeLabel(b.pickupTime))}${b.seatId ? ', ' + h(seatLabel(b.seatId)) : ''}</div>
      ${b.relocation && !b.relocation.confirmed ? `<div class="chip accent" style="align-self:flex-start"><span class="ci">${I.warning}</span>새 탑승 위치 안내, ${h(user(b.userId).name)}님 확인을 기다려요</div>` : ''}
      ${b.previousPoint && b.relocation && b.relocation.confirmed ? `<div class="chip accent" style="align-self:flex-start"><span class="ci">${I.check}</span>탑승 위치 변경 확인, 경로를 다시 짰어요</div>` : ''}
      ${rest.length ? `<div class="row" style="gap:8px">${rest.map((r, i) => `<span class="chip">${dv.idx + 2 + i}. ${h(user(r.userId).name)}, ${h(r.pickupPoint.label.replace(/ 앞$/, ''))}</span>`).join('')}</div>` : ''}`);
      }
      // 4) 좌석 정하기가 남은 수락 건
      const ps = pendingSeat();
      if (ps)
        return card(`<div class="eyebrow"><span class="dot"></span>좌석 배정</div>
      <div class="row"><span class="av">${avatar(ps.userId)}</span><div class="grow"><div class="h1">${h(user(ps.userId).name)}님 자리를 정해 주세요</div><div class="sub">오른쪽 차량 화면에서 고를 수 있어요</div></div></div>`);
      // 5) 경로 준비
      const accepted = bookings([BOOKING.ACCEPTED, BOOKING.APPROACHING]);
      if (accepted.length) {
        const plan = currentPlan();
        return card(
          `<div class="eyebrow"><span class="dot"></span>픽업 순서, 시간과 위치를 함께 비교했어요</div>
      <div class="stoplist">${plan.stops
        .map((s, i) => {
          const b = core.state.bookings[s.bookingId];
          return `<div class="stop"><span class="n">${i + 1}</span><b>${h(user(b.userId).name)}</b><span class="w">${h(b.pickupPoint.label)}, ${h(core.pickupTimeLabel(b.pickupTime))}</span><span class="t">${fmtHM(s.eta)} 도착</span></div>`;
        })
        .join('')}</div>
      <div class="sub" style="font-size:16px">${planReason(plan)}</div>
      <div class="btns"><button class="btn primary" data-act="startDrive">${I.nav}안내 시작</button></div>`,
          true,
        );
      }
      // 6) 모두 탑승
      if (ui.done || ui.home === 'arrived') {
        const n = tripBookings().filter((b) => b.status === BOOKING.COMPLETED).length;
        return card(
          ui.home === 'arrived'
            ? `<div class="eyebrow"><span class="dot"></span>도착</div><div class="h1">집에 도착했어요</div><div class="sub">오늘 ${n}명을 모셨어요. 좌석 설정은 다음 탑승 때도 그대로 불러와요.</div><div class="btns"><button class="btn" data-act="newTrip">새 운행 시작</button></div>`
            : `<div class="eyebrow"><span class="dot"></span>픽업 완료</div><div class="h1">${n}명 모두 탔어요</div><div class="sub">각자 자리에 저장한 설정을 적용했어요.</div><div class="btns"><button class="btn primary" data-act="goHome">${I.nav}집으로 안내</button></div>`,
        );
      }
      // 7) 대기
      return card(`<div class="eyebrow"><span class="dot"></span>카품</div>
    <div class="h1">${h(user(driverId()).name)}님, 퇴근길 안전 운전하세요</div>
    <div class="sub">동승자가 휴대폰으로 픽업을 요청하면 여기에 바로 떠요.</div>
    ${APP_MODE ? playlistRow() : ''}
    `);
    }

    // ---- 왼쪽 아래: 지도, 내비 ----
    function mapPanel() {
      return `<section class="panel mapp" aria-label="지도와 내비게이션"><div class="mapslot" id="pmap"></div>
    <div id="navcard"></div><div id="hazard"></div><div id="limit"></div>
    <div class="navbar" id="navbar" ${ui.drive ? '' : 'hidden'}></div></section>`;
    }
    function navParts() {
      const dv = ui.drive;
      if (!dv) return null;
      const m = GEO.nextManeuver(dv.route, dv.d);
      const legEnd = dv.route.legEnds[dv.idx] != null ? dv.route.legEnds[dv.idx] : dv.route.length;
      const remain = Math.max(0, legEnd - dv.d),
        mins = Math.max(1, Math.round(remain / 400));
      const b = !dv.home && core.state.bookings[dv.stops[dv.idx]];
      const legStart = dv.idx > 0 && dv.route.legEnds[dv.idx - 1] != null ? dv.route.legEnds[dv.idx - 1] : 0;
      const progress = legEnd > legStart ? (dv.d - legStart) / (legEnd - legStart) : 1;
      return {
        m,
        remain,
        mins,
        progress,
        eta: Date.now() + mins * 60000,
        target: dv.home ? GEO.PLACES.home.label : b ? `${user(b.userId).name}, ${b.pickupPoint.label}` : '',
      };
    }
    function live() {
      const n = navParts();
      const nc = document.getElementById('navcard'),
        nb = document.getElementById('navbar');
      if (n && ui.drive && ui.drive.paused) {
        n.m = { dir: 'arrive', dist: 0, text: n.target, name: '' };
        n.remain = 0;
        n.mins = 0;
        n.eta = Date.now();
      }
      const hz = document.getElementById('hazard'),
        lm = document.getElementById('limit'),
        dv0 = ui.drive;
      if (hz) {
        let html = '';
        if (dv0 && !dv0.paused) {
          const nb2 = (dv0.hazards || []).find((x) => x.d > dv0.d && x.d - dv0.d < 170);
          if (nb2)
            html = `<div class="hazard">${SIGN.bump}<div>과속방지턱 ${GEO.fmtDist(nb2.d - dv0.d)} 앞<small>속도를 줄여 주세요</small></div></div>`;
          else if (dv0.zone)
            html = `<div class="hazard zone">${SIGN.zone}<div>어린이 보호구역<small>시속 30km 이하로 천천히</small></div></div>`;
        }
        if (hz._h !== html) {
          hz._h = html;
          hz.innerHTML = html;
        }
      }
      if (lm) {
        const t = dv0 && !dv0.paused ? `<div class="limit">${dv0.limit || 50}</div>` : '';
        if (lm._h !== t) {
          lm._h = t;
          lm.innerHTML = t;
        }
      }
      if (nc)
        nc.innerHTML = n
          ? `<div class="navcard"><span class="arrow">${TURN[n.m.dir] || TURN.straight}</span><div><b>${n.m.dir === 'arrive' && !n.m.dist ? '도착' : GEO.fmtDist(n.m.dist)}</b><span>${h(n.m.text)}${n.m.name ? ', ' + h(n.m.name) : ''}</span></div></div>`
          : '';
      if (nb) {
        nb.hidden = !n;
        if (n)
          nb.innerHTML = `<b>${h(n.target)}</b><span class="sep"></span>${ui.drive.paused ? '<span>탑승을 기다리는 중</span>' : `<span>${GEO.fmtDist(n.remain)}</span><span class="sep"></span><span>약 ${n.mins}분</span><span style="margin-left:auto;font-weight:800">${fmtHM(n.eta)} 도착</span>`}`;
      }
      setGauge('st-speed', (ui.drive ? ui.drive.speedKmh : 0) / 60, ui.drive ? ui.drive.speedKmh : 0);
      if (n) setGauge('st-remain', ui.drive.paused ? 1 : n.progress, GEO.fmtDist(n.remain));
      const se = document.getElementById('st-eta');
      if (se && n) se.textContent = fmtHM(n.eta);
      updateMapData(true);
    }
    function updateMapData(fromLoop) {
      const dv = ui.drive;
      const stops = [];
      const list = dv && !dv.home ? dv.stops : ui.drive ? [] : currentPlan().order;
      list.forEach((id, i) => {
        const b = core.state.bookings[id];
        if (!b) return;
        const done = b.status === BOOKING.COMPLETED;
        stops.push(
          Object.assign(
            {
              key: id,
              n: i + 1,
              name: user(b.userId).name,
              cls: done ? 'done' : ui.board && ui.board.bid === id ? 'arrived' : '',
            },
            b.pickupPoint,
          ),
        );
      });
      let route = null;
      if (dv) route = GEO.slice(dv.route, dv.d, dv.route.length);
      PMap.set({ route, stops, car: ui.car, home: (dv && dv.home) || ui.done ? GEO.PLACES.home : null });
      if (dv && !dv.paused) PMap.follow(ui.car);
      else if (!fromLoop) {
        const pts = [ui.car].concat(stops);
        if ((dv && dv.home) || ui.done) pts.push(GEO.PLACES.home);
        if (dv && dv.paused) PMap.follow(Object.assign({}, ui.car));
        else PMap.overview(pts);
      }
    }

    // ---- 오른쪽: 위에서 본 차량 + 좌석 라벨 + 안내 ----
    function seatModel() {
      const seats = { FL: { uid: driverId(), ring: 'boarded', driver: true } };
      tripBookings().forEach((b) => {
        const sid = b.status === BOOKING.COMPLETED ? b.boardedSeatId || b.seatId : b.seatId;
        if (!sid || sid === 'FL') return;
        const prof = core.getProfile(b.userId, VID).saved;
        seats[sid] = {
          uid: b.userId,
          booking: b,
          profile: prof,
          ring: b.status === BOOKING.COMPLETED ? 'boarded' : 'planned',
          applied: b.status === BOOKING.COMPLETED && b.settingsApplied,
          order: b.plan && b.plan.order,
        };
      });
      const mode = { pickable: [] };
      if (ui.seatPick) {
        mode.pickable = freeSeats(ui.seatPick.bid);
        mode.pickable.forEach((s) => {
          seats[s] = Object.assign(seats[s] || {}, { ring: 'pick' });
        });
      }
      if (ui.board && ['identify', 'confirmSeat'].includes(ui.board.step)) {
        const det = ui.board.detected;
        seats[det] = Object.assign(seats[det] || {}, { ring: 'detected' });
        if (ui.board.step === 'confirmSeat') mode.pickable = freeSeats(ui.board.bid);
      }
      if (ui.board && ui.board.step === 'mismatch') {
        seats[ui.board.actual] = Object.assign(seats[ui.board.actual] || {}, { ring: 'chosen' });
      }
      if (ui.fx && Date.now() < ui.fx.until && seats[ui.fx.seat]) seats[ui.fx.seat].fx = true;
      if (ui.edit && seats[ui.edit.seat]) seats[ui.edit.seat].ring = 'chosen';
      return { seats, mode };
    }
    function seatChips(p) {
      if (!p) return '';
      const caps = veh().capabilities;
      const out = [];
      out.push(`<span class="chip">등받이 ${p.recline < 25 ? '곧게' : p.recline < 55 ? '편안하게' : '젖힘'}</span>`);
      if (caps.heater && p.heater.on) out.push(`<span class="chip heat">열선 ${p.heater.level}단</span>`);
      if (caps.climate && p.climate.on)
        out.push(`<span class="chip accent">${p.climate.temp}°, 바람 ${p.climate.fan}</span>`);
      if (caps.window && p.window.open) out.push(`<span class="chip">창문 ${p.window.open}%</span>`);
      return out.join('');
    }
    function carPanel() {
      const { seats, mode } = seatModel();
      const t = tripBookings();
      const boarded = t.filter((b) => b.status === BOOKING.COMPLETED).length;
      const n = navParts();
      const promptHtml = carPrompt(seats);
      return `<section class="panel car ${promptHtml ? 'has-prompt' : ''}" aria-label="좌석과 탑승자">
    <div class="stats">
      <div class="boardbars" aria-label="탑승 인원 ${boarded}/${t.length}"><b>${boarded}<span>/${t.length}</span></b><div class="bars">${(t.length ? t : [{}]).map((bk, i) => `<span class="bar ${bk.status === BOOKING.COMPLETED ? 'on' : ''}" style="height:${12 + i * 7}px"><i></i></span>`).join('')}</div><small>탑승 인원</small></div>
      ${gauge('st-speed', (ui.drive ? ui.drive.speedKmh : 0) / 60, ui.drive ? ui.drive.speedKmh : 0, 'km/h', true)}
      ${gauge('st-remain', n ? n.progress : 0, n ? GEO.fmtDist(n.remain) : '—', n && !ui.drive.home ? '다음 픽업까지' : '남은 거리')}
    </div>
    <div class="carstage" id="carstage" data-seats='${h(JSON.stringify(Object.keys(seats)))}'>${carSVG(veh(), seats, mode)}<svg class="leaders" id="leaders"></svg>${seatLabels(seats)}</div>
    ${
      APP_MODE
        ? `<nav class="apptools" aria-label="카품 메뉴"><button class="${ui.edit ? 'on' : ''}" data-act="${ui.edit ? 'railHome' : 'railSeat'}" aria-label="좌석 설정">${rimg('seat')}</button><button data-act="openDemo" aria-label="설정">${rimg('gear')}</button></nav>`
        : ''
    }
    ${promptHtml}
  </section>`;
    }
    function seatLabels(seats) {
      return ['FL', 'FR', 'RL', 'RR']
        .map((sid) => {
          const s = seats[sid] || {};
          const left = sid[1] === 'L';
          let name,
            st,
            cls = '',
            chips = '',
            sum = '';
          if (sid === 'FL') {
            name = `${h(user(driverId()).name)} (운전석)`;
            st = '운전자';
          } else if (s.uid) {
            const b = s.booking;
            name = `${h(who(s.uid))}`;
            st =
              b.status === BOOKING.COMPLETED
                ? b.settingsApplied
                  ? '탑승, 설정 적용됨'
                  : '탑승, 설정 그대로'
                : `${s.order ? s.order + '번째 ' : ''}탑승 예정`;
            cls = b.status === BOOKING.COMPLETED ? 'on' : '';
            chips = seatChips(s.profile);
            const p = s.profile,
              caps = veh().capabilities;
            sum = [
              caps.heater && p.heater.on ? '열선 ' + p.heater.level + '단' : '',
              caps.climate && p.climate.on ? p.climate.temp + '°' : '',
              p.recline >= 55 ? '젖힘' : '',
            ]
              .filter(Boolean)
              .join(', ');
          } else {
            name = h(seatLabel(sid));
            st = '빈자리';
          }
          return `<div class="seatlabel ${left ? 'l' : 'r'}" data-for="${sid}"><b>${name}</b><span class="st ${cls}">${st}</span>${chips ? `<span class="chips">${chips}</span>` : ''}${sum ? `<span class="sum">${sum}</span>` : ''}</div>`;
        })
        .join('');
    }
    function layoutCar() {
      const stage = document.getElementById('carstage');
      if (!stage) return;
      const W = stage.clientWidth,
        H = stage.clientHeight,
        g = stageGeom(W, H);
      const svg = stage.querySelector('svg.carsvg');
      Object.assign(svg.style, { left: g.X0 + 'px', top: g.Y0 + 'px', width: g.CW + 'px', height: g.CH + 'px' });
      stage.classList.toggle('tight', g.pt('RR').y - g.pt('FR').y < 120);
      const lines = [];
      stage.querySelectorAll('.seatlabel').forEach((el) => {
        const sid = el.dataset.for,
          p = g.pt(sid),
          left = sid[1] === 'L';
        const lx = left ? 8 : W - LABEL_W - 8;
        el.style.left = lx + 'px';
        el.style.top = p.y + 'px';
        const ex = left ? lx + LABEL_W + 4 : lx - 4;
        lines.push(
          `<path d="M${ex} ${p.y} L${p.x + (left ? -g.CW * 0.1 : g.CW * 0.1)} ${p.y}" stroke="var(--muted-2)" stroke-width="1.5" fill="none"/><circle cx="${ex}" cy="${p.y}" r="3" fill="var(--muted-2)"/>`,
        );
      });
      document.getElementById('leaders').innerHTML = lines.join('');
    }
    function carPrompt(seats) {
      const box = (inner) => `<div class="prompt slidein">${inner}</div>`;
      // 적용 결과(Vehicle SDK)
      if (ui.fx && Date.now() < ui.fx.until) {
        return box(
          `<div class="eyebrow"><span class="dot live"></span>${h(seatLabel(ui.fx.seat))}, ${h(user(ui.fx.uid).name)}님 설정 적용</div><div class="sdklog">${ui.fx.lines.map((l, i) => `<div style="animation-delay:${i * 0.25}s">✓ ${l}</div>`).join('')}</div>`,
        );
      }
      // 탑승 확인 단계
      if (ui.board) {
        const b = core.state.bookings[ui.board.bid];
        if (!b) return '';
        const st = ui.board.step;
        if (st === 'wait')
          return box(
            `<div class="eyebrow"><span class="dot live"></span>좌석 점유 감지 중</div><div class="h2">${h(user(b.userId).name)}님이 타면 알려 드릴게요</div>`,
          );
        if (st === 'identify')
          return box(
            `<div class="eyebrow"><span class="dot live"></span>${h(seatLabel(ui.board.detected))} 착석 감지</div><div class="h2">탑승하신 분은 본인을 눌러 주세요</div><div class="who"><button data-act="iam">${avatar(b.userId, 'lg')}<span>${h(who(b.userId))}</span></button></div>`,
          );
        if (st === 'confirmSeat')
          return box(
            `<div class="h2">${h(seatLabel(ui.board.detected))}에 앉으셨나요?</div><div class="sub">다른 자리라면 위 차량에서 실제로 앉은 좌석을 눌러 주세요.</div><div class="btns"><button class="btn primary" data-act="seatYes">${I.check}네, 맞아요</button></div>`,
          );
        if (st === 'mismatch')
          return box(`<div class="eyebrow"><span class="dot" style="background:var(--warn)"></span>예정 좌석과 달라요</div>
      <div class="h2">예정은 ${h(seatLabel(b.seatId))}인데 ${h(seatLabel(ui.board.actual))}에 앉으셨어요.<br>좌석 배정과 설정값을 바꿀까요?</div>
      <button class="toggle ${ui.board.remember ? 'on' : ''}" data-act="toggleRemember" style="border:none;background:none;padding:0"><i></i>이 좌석 기억하기</button>
      <div class="btns"><button class="btn primary" data-act="mismatchFix">바꾸고 내 설정 적용</button><button class="btn" data-act="mismatchKeep">그대로 두기</button></div>`);
      }
      // 좌석 고르기(이번에는 어디에 앉을까요?)
      if (ui.seatPick) {
        const b = core.state.bookings[ui.seatPick.bid];
        if (!b) return '';
        return box(`<div class="eyebrow"><span class="dot live"></span>좌석 배정, ${h(user(b.userId).name)}님</div><div class="h2">이번에는 어디에 앉을까요?</div><div class="sub">위 차량에서 빈 좌석을 눌러 주세요.</div>
      <button class="toggle ${ui.seatPick.remember ? 'on' : ''}" data-act="togglePickRemember" style="border:none;background:none;padding:0"><i></i>이 좌석 기억하기</button>`);
      }
      // 기억한 좌석 확인
      const ps = pendingSeat();
      if (ps && ps.seatFromMemory && ps.seatId) {
        return box(`<div class="eyebrow"><span class="dot live"></span>좌석 배정, ${h(user(ps.userId).name)}님</div><div class="h2">기억한 ${h(seatLabel(ps.seatId))}을 이번에도 쓸까요?</div>
      <div class="btns"><button class="btn primary" data-act="memYes" data-id="${ps.id}">네, ${h(seatLabel(ps.seatId))}으로 할게요</button><button class="btn" data-act="memNo" data-id="${ps.id}">다른 자리로 바꿀게요</button></div>`);
      }
      if (ps && !ps.seatId) {
        ui.seatPick = { bid: ps.id, remember: false };
        return carPrompt(seats);
      }
      // 운전자 대신 조정
      if (ui.edit) {
        const s = seats[ui.edit.seat];
        if (!s || !s.uid) {
          ui.edit = null;
          return '';
        }
        const d = ui.edit.draft,
          caps = veh().capabilities;
        const opt = (key, val, label, cur) =>
          `<button class="${cur ? 'on' : ''}" data-act="editSet" data-k="${key}" data-v="${val}">${label}</button>`;
        return box(`<div class="eyebrow"><span class="dot"></span>${h(seatLabel(ui.edit.seat))}, ${h(who(s.uid))}님 자리</div>
      <div class="ctrl"><span>등받이</span><div class="opts">${opt('recline', 10, '곧게', d.recline < 25)}${opt('recline', 40, '편안하게', d.recline >= 25 && d.recline < 55)}${opt('recline', 75, '누워서', d.recline >= 55)}</div>
      ${caps.heater ? `<span>열선</span><div class="opts">${opt('heat', 0, '끔', !d.heater.on)}${[1, 2, 3].map((l) => opt('heat', l, l + '단', d.heater.on && d.heater.level === l)).join('')}</div>` : ''}
      ${caps.climate ? `<span>온도</span><div class="opts">${opt('temp', -1, '−', false)}<button disabled style="background:none">${d.climate.on ? d.climate.temp + '°' : '끔'}</button>${opt('temp', 1, '+', false)}</div>` : ''}</div>
      <div class="btns"><button class="btn primary" data-act="editApply">이 자리에 적용</button><button class="btn" data-act="editClose">닫기</button></div>`);
      }
      return '';
    }
    function demoModal() {
      return `<div class="modal" data-act="closeModalBg"><div class="box" role="dialog" aria-modal="true">
    <div class="h2">설정</div>

    <div class="sub" style="font-size:16px">시연 도구</div>
    <div class="grid">
      <button class="btn sm" data-act="demoObstacle">장애물(탑승 위치 변경)</button>
      <button class="btn sm" data-act="toggleTheme">화면 색 바꾸기</button>
      <button class="btn sm" data-act="demoRequests">픽업 요청 받기</button>
      <button class="btn sm ${ui.speed > 1 ? 'primary' : ''}" data-act="toggleSpeed">빨리 감기 ${ui.speed > 1 ? '켜짐' : '꺼짐'}</button>
      <button class="btn sm ${ui.mismatchDemo ? 'primary' : ''}" data-act="toggleMismatch">다른 자리에 앉기 ${ui.mismatchDemo ? '켜짐' : '꺼짐'}</button>
      <button class="btn sm" data-act="logout">로그아웃(QR 다시)</button>
      <button class="btn sm danger" data-act="resetDemo">처음부터 다시</button>
      <button class="btn sm" data-act="closeModal">닫기</button>
    </div></div></div>`;
    }
    function loginView() {
      if (!ui.qr || (Date.now() - ui.qr.issuedAt) / 1000 >= ui.qr.ttlSec) issueQr();
      const rem = Math.max(0, Math.ceil(ui.qr.ttlSec - (Date.now() - ui.qr.issuedAt) / 1000));
      const C = 2 * Math.PI * 160;
      return `${rail()}<section class="panel login" aria-label="로그인">
    <div><span class="emb" style="display:block">${EMBLEM('lg')}</span>
      <div class="h1" style="font-size:44px;margin-top:18px">카품을 시작할게요</div>
      ${APP_MODE ? `<div class="welcome">어서 오세요, ${h(user(driverId()).name)}님</div>` : ''}
      <div class="sub" style="font-size:21px;margin-top:8px">운전자 휴대폰으로 QR을 스캔하면 픽업 요청과 좌석 설정을 이 차에서 받을 수 있어요.</div>
      ${APP_MODE ? '<div class="introvid" id="introvid"></div>' : `<img class="carimg" src="${pimg('car-34')}" alt="${h(veh().name)}">`}
      <div class="steps"><div><i>1</i>휴대폰에서 카품 앱 열기</div><div><i>2</i>Pleos 연결 → QR 스캔</div><div><i>3</i>휴대폰에서 연결 승인</div></div></div>
    <div class="qrbox"><div class="qrwrap">${qrSVG(ui.qr.code)}<svg class="ringt" viewBox="0 0 330 330"><circle cx="165" cy="165" r="160" fill="none" stroke="var(--panel-3)" stroke-width="6"/><circle id="qr-ring" cx="165" cy="165" r="160" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - rem / QR_TTL)}"/></svg></div>
      <div class="sub" id="qr-rem">${rem}초 뒤 새 QR로 바뀌어요, 코드 ${h(ui.qr.code)}</div>
      <button class="btn ghost sm" style="width:100%" data-act="demoScan">${I.phone}${h(user(driverId()).name)}님 휴대폰으로 스캔</button></div>
  </section>`;
    }
    let qrTimer = 0;
    // 시작 화면 영상(앱 모드): 밤 화면은 엑스레이, 낮 화면은 햇빛 아래의 차. 화면을 다시 그려도 이어서 재생되게 한 번만 만든다
    let introEl = null;
    function mountIntro() {
      const slot = document.getElementById('introvid');
      if (!slot) return;
      const src = ui.theme === 'light' ? 'intro-day.mp4' : 'intro-night.mp4';
      if (!introEl) {
        introEl = document.createElement('video');
        Object.assign(introEl, { muted: true, loop: true, autoplay: true, playsInline: true, preload: 'auto' });
        introEl.setAttribute('aria-hidden', 'true');
      }
      // APK는 같은 폴더, 웹(dist/)은 저장소의 assets/pleos 폴더에서 불러온다
      introEl.onerror = () => {
        const cur = introEl.getAttribute('src') || '';
        if (!cur.startsWith('../')) introEl.setAttribute('src', '../assets/pleos/' + cur);
      };
      if (!(introEl.getAttribute('src') || '').endsWith(src)) introEl.setAttribute('src', src);
      slot.appendChild(introEl);
      const p = introEl.play();
      if (p && p.catch) p.catch(() => {});
    }
    function renderAll() {
      display.querySelector('#statusbar').innerHTML = statusbar();
      display.querySelector('#dock').innerHTML = dock();
      clearInterval(qrTimer);
      if (!linked()) {
        app.innerHTML = loginView();
        mountIntro();
        qrTimer = setInterval(() => {
          if (linked()) {
            clearInterval(qrTimer);
            renderAll();
            return;
          }
          const rem = Math.ceil(ui.qr.ttlSec - (Date.now() - ui.qr.issuedAt) / 1000);
          if (rem <= 0) {
            renderAll();
            return;
          }
          const r = document.getElementById('qr-ring'),
            t = document.getElementById('qr-rem');
          const C = 2 * Math.PI * 160;
          if (r) r.setAttribute('stroke-dashoffset', C * (1 - rem / QR_TTL));
          if (t) t.textContent = `${rem}초 뒤 새 QR로 바뀌어요, 코드 ${ui.qr.code}`;
        }, 500);
        renderOverlay();
        return;
      }
      autoSeatOk();
      display.classList.toggle('driving', !!(ui.drive && !ui.drive.paused));
      app.innerHTML = rail() + alertPanel() + mapPanel() + carPanel();
      PMap.mount(document.getElementById('pmap'));
      layoutCar();
      live();
      updateMapData(false);
      renderOverlay();
    }

    /* ===================== 동작 ===================== */
    function applyFx(b, seatId) {
      const p = core.getProfile(b.userId, VID).saved,
        caps = veh().capabilities,
        lines = [];
      // Pleos Vehicle SDK: 좌석 위치, 등받이는 절대값 지정이 없어 현재 위치를 확인하며 목표까지 이동(moveSeat…), 나머지는 값 지정
      lines.push(`좌석 앞뒤, <b>${p.seatPosition < 30 ? '앞쪽' : p.seatPosition < 70 ? '가운데' : '뒤쪽'}</b>`);
      lines.push(`등받이, <b>${p.recline < 25 ? '곧게' : p.recline < 55 ? '편안하게' : '많이 젖힘'} ${p.recline}%</b>`);
      if (caps.heater) lines.push(`열선, <b>${p.heater.on ? p.heater.level + '단' : '끔'}</b>`);
      if (caps.climate)
        lines.push(
          `${h(seatLabel(seatId))} 공조, <b>${p.climate.on ? p.climate.temp + '°C, 바람 ' + p.climate.fan : '끔'}</b>`,
        );
      if (caps.window) lines.push(`창문, <b>${p.window.open ? p.window.open + '%' : '닫기'}</b>`);
      ui.fx = { seat: seatId, uid: b.userId, until: Date.now() + 3600, lines };
    }
    function finishBoard(seatId, opts) {
      const b = core.state.bookings[ui.board.bid];
      const r = core.boardPassenger(driverId(), b.id, seatId, opts);
      ui.board = null;
      if (r.applied) {
        applyFx(b, seatId);
        toast('check', `${user(b.userId).name}님 탑승, ${seatLabel(seatId)}에 내 설정 적용`);
      } else toast('check', `${user(b.userId).name}님 탑승, 설정은 그대로 둘게요`);
      renderAll();
      setTimeout(
        () => {
          ui.fx = null;
          resume();
        },
        r.applied ? 3700 : 1200,
      );
    }
    const act = {
      accept(el) {
        core.driverDecide(driverId(), el.dataset.id, true);
        toast('check', `${user(core.state.bookings[el.dataset.id].userId).name}님 픽업을 수락했어요`);
        if (ui.drive && !ui.drive.paused) replan();
      },
      reject(el) {
        core.driverDecide(driverId(), el.dataset.id, false);
      },
      memYes(el) {
        ui.seatOk[el.dataset.id] = true;
        renderAll();
      },
      memNo(el) {
        ui.seatPick = { bid: el.dataset.id, remember: true };
        renderAll();
      },
      togglePickRemember() {
        ui.seatPick.remember = !ui.seatPick.remember;
        renderAll();
      },
      pickSeat(el) {
        const sid = el.dataset.seat;
        if (ui.board && ui.board.step === 'confirmSeat') {
          const b = core.state.bookings[ui.board.bid];
          if (!b.seatId || b.seatId === sid) finishBoard(sid, { reassign: true });
          else {
            Object.assign(ui.board, { step: 'mismatch', actual: sid, remember: !!b.seatFromMemory });
            renderAll();
          }
          return;
        }
        if (ui.seatPick) {
          try {
            core.driverAssignSeat(driverId(), ui.seatPick.bid, sid, ui.seatPick.remember);
            ui.seatOk[ui.seatPick.bid] = true;
            ui.seatPick = null;
            renderAll();
          } catch (e) {
            toast('warning', e.message);
          }
        }
      },
      iam() {
        ui.board.step = 'confirmSeat';
        renderAll();
      },
      seatYes() {
        const b = core.state.bookings[ui.board.bid],
          det = ui.board.detected;
        if (b.seatId && b.seatId !== det) {
          Object.assign(ui.board, { step: 'mismatch', actual: det, remember: !!b.seatFromMemory });
          renderAll();
        } else finishBoard(det, { reassign: true });
      },
      toggleRemember() {
        ui.board.remember = !ui.board.remember;
        renderAll();
      },
      mismatchFix() {
        finishBoard(ui.board.actual, { reassign: true, remember: ui.board.remember });
      },
      mismatchKeep() {
        finishBoard(ui.board.actual, { reassign: false });
      },
      remind(el) {
        core.handleVehicleEvent({ type: 'DRIVER_REMIND', bookingId: el.dataset.id });
        toast('bell', '휴대폰으로 탑승 알림을 다시 보냈어요');
      },
      call(el) {
        core.handleVehicleEvent({ type: 'DRIVER_CALL_REQUEST', bookingId: el.dataset.id });
        toast('call', '앱 통화를 요청했어요');
      },
      cancelPickup(el) {
        core.handleVehicleEvent({
          type: 'DRIVER_CANCEL',
          bookingId: el.dataset.id,
          reason: '운전자가 픽업을 취소했어요.',
        });
        ui.board = null;
        toast('cross', '픽업을 취소하고 다음으로 이동해요');
        resume();
      },
      startDrive() {
        startDrive();
      },
      goHome() {
        goHome();
      },
      newTrip() {
        ui.home = null;
        ui.done = false;
        ui.tripStart = Date.now();
        ui.car = { lat: GEO.PLACES.office.lat, lng: GEO.PLACES.office.lng, bearing: 250 };
        renderAll();
        headOnRoad();
      },
      editSeat(el) {
        if (ui.board || ui.seatPick) return;
        if (ui.drive && !ui.drive.paused) {
          toast('lock', '주행 중에는 좌석 설정을 바꿀 수 없어요. 정차하면 다시 열려요');
          return;
        }
        const sid = el.dataset.seat;
        const { seats } = seatModel();
        const s = seats[sid];
        if (!s || !s.uid || sid === 'FL') return;
        ui.edit = { seat: sid, uid: s.uid, draft: C.clone(core.getProfile(s.uid, VID).saved) };
        renderAll();
      },
      editSet(el) {
        const d = ui.edit.draft,
          k = el.dataset.k,
          v = Number(el.dataset.v);
        if (k === 'recline') d.recline = v;
        if (k === 'heat') {
          d.heater.on = v > 0;
          if (v > 0) d.heater.level = v;
        }
        if (k === 'temp') {
          d.climate.on = true;
          d.climate.temp = Math.max(16, Math.min(30, d.climate.temp + v));

      editApply() {
        const e = ui.edit;
        core.driverSaveProfile(driverId(), e.uid, VID, e.draft);

      railSeat() {
        if (ui.drive && !ui.drive.paused) {
          toast('lock', '주행 중에는 좌석 설정을 바꿀 수 없어요. 정차하면 다시 열려요');
          return;

        const { seats } = seatModel();
        const sid = ['FR', 'RL', 'RR'].find((s) => seats[s] && seats[s].uid);
        if (sid) act.editSeat({ dataset: { seat: sid } });

      sysApp(el) {
        toast('info', `${el.dataset.name} 앱은 시연에서 열지 않아요`);
      },
      // 장애물 체험: 다음 탑승 위치에 주정차 차량 → 경로 위 45m 앞 지점을 새 탑승 위치로 안내(동승자 확인 시 경로 다시 계산)
      playSuggest(el) {
        const m = PLAYLIST[+el.dataset.i];
        if (!m) return;
        // 재생 표시만 바꾼다(시연). 실제 재생은 Pleos 음악 앱 연동 뒤에 지원한다
        ui.playing = ui.playing === +el.dataset.i ? null : +el.dataset.i;
        toast('music', ui.playing == null ? '재생을 멈췄어요' : `${m.title}을(를) 재생해요`);

      demoObstacle() {
        ui.modal = null;
        renderOverlay();
        const dv = ui.drive;
        if (!dv || dv.home) {
          toast('warning', '운행 중에 쓸 수 있어요');
          return;
        }
        const bid = dv.stops[dv.idx],
          b = core.state.bookings[bid];
        if (!b || ![BOOKING.ACCEPTED, BOOKING.APPROACHING].includes(b.status)) {
          toast('warning', '지금 가는 픽업이 없어요');
          return;
        }
        const end = dv.route.legEnds[dv.idx] != null ? dv.route.legEnds[dv.idx] : dv.route.length;
        const p = GEO.pointAlong(dv.route, Math.max(dv.d + 20, end - 45));
        core.handleVehicleEvent({
          type: 'OBSTACLE_REPORTED',
          bookingId: bid,
          point: { lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6), label: GEO.labelFor(p) + ' (앞쪽 약 45m)' },
          message: '탑승 장소에 주정차 차량이 있어요. 앞쪽 45m 지점으로 조금 이동해 주세요.',
        });
        toast('warning', `탑승 위치에 주정차 차량, ${user(b.userId).name}님께 45m 앞 탑승 위치를 안내했어요`);
      },
      openDemo() {
        ui.modal = 'demo';
        renderOverlay();
      },
      closeModal() {
        ui.modal = null;
        renderOverlay();
      },
      closeModalBg(el, ev) {
        if (ev.target === el) {
          ui.modal = null;
          renderOverlay();

      },
      demoScan() {
        const r = core.confirmPleosLink(driverId(), ui.qr);
        if (r.ok) toast('link', `${user(driverId()).name}님, 반가워요. ${veh().name}에 연결했어요`);
        else toast('warning', r.message);

      demoRequests() {

    };
    display.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const f = act[el.dataset.act];
      if (!f) return;
      if (el.dataset.act !== 'closeModalBg') ev.preventDefault();
      try {
        f(el, ev);
      } catch (e) {
        toast('warning', e.message || String(e));
      }
    });

    /* ===================== 코어 변경 반영 ===================== */
    let lastNotif = null;
    core.subscribe((state, reason) => {
      // 운행 중에 예약이 바뀌면(취소, 새 수락) 경로를 다시 짠다
      const dv = ui.drive;
      if (dv && !dv.home) {
        const activeIds = bookings([BOOKING.ACCEPTED, BOOKING.APPROACHING, BOOKING.ARRIVED]).map((b) => b.id);
        const remaining = dv.stops.slice(dv.idx);
        if (!dv.paused && !dv.replanning && stopsChanged(dv)) {
          setTimeout(replan, 50);
        }
        if (
          ui.board &&
          !ACTIVE_STATES.includes((core.state.bookings[ui.board.bid] || {}).status) &&
          (core.state.bookings[ui.board.bid] || {}).status !== BOOKING.COMPLETED
        ) {
          ui.board = null;
          setTimeout(resume, 50);
        } else if (
          !dv.paused &&
          (activeIds.some((id) => !remaining.includes(id)) || remaining.some((id) => !activeIds.includes(id)))
        )
          setTimeout(replan, 50);
      }
      // 새 픽업 요청이 오면 띠 알림
      const req = bookings([BOOKING.REQUESTED]);
      const newest = req[req.length - 1];
      if (newest && newest.id !== lastNotif && Date.now() - newest.createdAt < 4000) {
        lastNotif = newest.id;
        toast('bell', `${user(newest.userId).name}님 픽업 요청이 도착했어요`);
      }
      if (reason === 'pleosQr') return; // 내가 띄운 QR이 돌아온 것
      if (!ui.drive || ui.drive.paused || ['booking', 'route', 'sync', 'pleos', 'profile'].includes(reason))
        renderAll();
    });

    /* ===================== 화면 맞춤, 시작 ===================== */
    function fit() {
      // innerWidth는 휴대폰에서 화면보다 넓은 내용이 있으면 커지므로, 실제로 보이는 크기(clientWidth)를 쓴다
      const vw = document.documentElement.clientWidth || innerWidth;
      const vh = document.documentElement.clientHeight || innerHeight;
      // 앱 모드(APK)는 검은 여백 없이 창을 채운다: 1600×900을 기준으로 남는 쪽만 늘린다
      const w = APP_MODE ? Math.max(1600, Math.round((900 * vw) / vh)) : 1600;
      const hgt = APP_MODE ? Math.max(900, Math.round((1600 * vh) / vw)) : 900;
      const s = Math.min(vw / w, vh / hgt);
      display.style.width = w + 'px';
      display.style.height = hgt + 'px';
      display.style.transform = `translate(${(vw - w * s) / 2}px,${(vh - hgt * s) / 2}px) scale(${s})`;
      display.style.borderRadius = APP_MODE || (s < 1 && QS.has('embed')) ? '0' : '22px';
    }
    addEventListener('resize', fit);
    fit();
    setInterval(() => {
      const c = display.querySelector('.clock');
      if (c) {
        const d = new Date();
        c.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }
    }, 10000);
    lastNotif = (bookings([BOOKING.REQUESTED]).slice(-1)[0] || {}).id;
    // 출발 전 차량 방향: 회사에서 나가는 첫 도로 방향(경로 첫 구간)으로 맞춘다
    function headOnRoad() {
      GEO.fetchRoute([GEO.PLACES.office, GEO.PLACES.daycare]).then((r) => {
        if (!ui.drive && GEO.haversine(ui.car, GEO.PLACES.office) < 5) {
          ui.car.bearing = GEO.pointAlong(r, 4).bearing;
          updateMapData(false);
        }
      });
    }
    headOnRoad();
    renderAll();
    // 디버그, 자동 테스트용 훅
    window.__pleos = {
      core,
      ui,
      act,
      map: PMap,
      renderAll,
      get drive() {
        return ui.drive;
      },
      finish() {
        const dv = ui.drive;
        if (dv) {
          dv.d = (dv.route.legEnds[dv.idx] != null ? dv.route.legEnds[dv.idx] : dv.route.length) - 1;
        }
      },
    };
  })();
</script>
